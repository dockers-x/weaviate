name: Mirror weaviate image

on:
  schedule:
    - cron: "13 2 * * *"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/dockers-x/weaviate

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve latest 1.36.x and skip if built
        id: check
        run: |
          TAG=$(curl -s "https://registry-1.docker.io/v2/repositories/semitechnologies/weaviate/tags/list" | jq -r ".tags[]" 2>/dev/null | grep -E "^1\.36\.[0-9]+$" | sort -V | tail -1)
          if [ -z "$TAG" ]; then
            TAG=$(curl -sL -H "Authorization: Bearer $(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:semitechnologies/weaviate:pull" | jq -r .token)" "https://registry-1.docker.io/v2/semitechnologies/weaviate/tags/list" | jq -r ".tags[]" | grep -E "^1\.36\.[0-9]+$" | sort -V | tail -1)
          fi
          echo "tag=$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/v$TAG" | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login GHCR
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            UPSTREAM_TAG=${{ steps.check.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.check.outputs.tag }}
            ${{ env.IMAGE }}:latest

      - name: Tag release
        if: github.event_name != 'pull_request' && steps.check.outputs.skip != 'true'
        run: |
          git tag "v${{ steps.check.outputs.tag }}"
          git push origin "v${{ steps.check.outputs.tag }}"
